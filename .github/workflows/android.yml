# Builds the Android alarm app (folder android/). On main it publishes the APK as the latest release,
# which the web app downloads from: releases/latest/download/budzik-dz.apk
name: Budzik Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      # Signing key from repository secrets, so every build installs over the previous one.
      # Without the secrets: a one-off key (an update then needs the old app uninstalled first).
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.BUDZIK_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/budzik.keystore
          else
            echo "::warning::No BUDZIK_KEYSTORE_B64 secret, using a one-off signing key"
            keytool -genkeypair -keystore android/budzik.keystore -storepass budzik-tymczasowy -keypass budzik-tymczasowy \
              -alias budzik -keyalg RSA -keysize 2048 -validity 20000 -dname "CN=Budzik DZ"
          fi
      - name: Build APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          BUDZIK_KEYSTORE_PASSWORD: ${{ secrets.BUDZIK_KEYSTORE_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk budzik-dz.apk
      - uses: actions/upload-artifact@v4
        with:
          name: budzik-dz
          path: budzik-dz.apk
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: budzik-${{ github.run_number }}
          name: Budzik DZ (Android) ${{ github.run_number }}
          body: Aplikacja Android z prawdziwym budzikiem dla Domowych Zadań. Instrukcja w android/README.md.
          files: budzik-dz.apk
          make_latest: "true"
